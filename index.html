<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Lớp A10</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b051a;
            color: #fff;
            overflow: hidden;
        }

        /* Nền dải ngân hà hồng */
        #space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: radial-gradient(circle at center, #2e103d 0%, #0d031a 70%, #05010a 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
            z-index: -2;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* Hiệu ứng Trái tim, Bóng bay bay ngẫu nhiên toàn màn hình */
        .floating-icon {
            position: fixed;
            color: #ff69b4;
            user-select: none;
            pointer-events: none;
            z-index: -1;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.9));
        }

        .balloon {
            position: fixed;
            width: 30px;
            height: 38px;
            background: radial-gradient(circle at 30% 30%, #ff9ebb, #ff2a6d);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            pointer-events: none;
            z-index: -1;
            animation: floatBalloon 9s ease-in-out infinite;
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.3), 0 0 15px rgba(255, 105, 180, 0.6);
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
            100% { transform: translateY(-10vh) scale(1.4) rotate(360deg); opacity: 0; }
        }

        @keyframes floatBalloon {
            0% { transform: translateY(110vh) translateX(0) rotate(-5deg); opacity: 0; }
            100% { transform: translateY(-15vh) translateX(30px) rotate(10deg); opacity: 0; }
        }

        /* Container chính */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Slide / Section */
        .section {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            transform: scale(0.92);
            padding: 20px;
        }

        .section.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Tiêu đề */
        .main-title {
            font-size: 2.1rem;
            color: #ffb6c1;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            font-weight: bold;
            animation: glowTitle 2.5s infinite alternate;
        }

        @keyframes glowTitle {
            0% { text-shadow: 0 0 12px rgba(255, 105, 180, 0.6); }
            100% { text-shadow: 0 0 30px rgba(255, 105, 180, 1); }
        }

        /* Phần Khám phá đóa hoa A10 */
        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(30, 15, 55, 0.75);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
            max-width: 950px;
            width: 100%;
        }

        .flower-gallery {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Hình Trái Tim hồng neon */
        .heart-flower {
            width: 50px;
            height: 50px;
            background: #ff2a6d;
            transform: rotate(-45deg);
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.85);
            transition: transform 0.3s;
            position: relative;
        }

        .heart-flower::before,
        .heart-flower::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: inherit;
        }

        .heart-flower::before { top: -25px; left: 0; }
        .heart-flower::after { left: 25px; top: 0; }

        .heart-flower:hover {
            transform: scale(1.2) rotate(-45deg);
            background: #ff0055;
        }

        /* Phần Bìa thư và Thư chúc mừng */
        .envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* Bìa thư */
        .envelope {
            width: 400px;
            height: 250px;
            background: linear-gradient(135deg, #fff0f5, #ffccd5);
            border-radius: 15px;
            border: 3px solid #ff2a6d;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.5s;
        }

        .envelope.opened {
            transform: translateY(-20px) scale(1.05);
        }

        /* Nút tròn mở thư ở giữa */
        .open-seal {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff2a6d, #b7094c);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff2a6d;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: white;
            z-index: 10;
            transition: transform 0.3s;
        }

        .open-seal:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #ff2a6d;
        }

        /* Thư chúc mừng giấu bên trong */
        .letter {
            width: 360px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            border: 2px dashed #ff4d6d;
            color: #5c061c;
            text-align: left;
            position: absolute;
            top: 250px; /* Ban đầu giấu dưới bìa thư */
            left: 20px;
            z-index: 5;
            transition: top 0.7s ease-out; /* Hiệu ứng chui từ bao lên */
        }

        /* Khi thư đã mở */
        .envelope.opened .letter {
            top: -150px; /* Thư chui lên khỏi bìa */
        }

        .letter h2 {
            margin-bottom: 15px;
            color: #d90429;
            font-size: 1.5rem;
            text-align: center;
        }

        .letter p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #4a0410;
        }

        .signature {
            font-style: italic;
            font-weight: bold;
            text-align: right;
            color: #b7094c;
        }

        /* Nút chuyển slide */
        .next-btn {
            background: linear-gradient(45deg, #ff2a6d, #ff758c);
            color: white;
            border: none;
            padding: 13px 35px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 22px rgba(255, 42, 109, 0.6);
            margin-top: 20px;
            z-index: 50;
        }

        .next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 42, 109, 0.8);
        }

        /* Fullscreen Photo Modal xem ảnh */
        #photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 10, 0.93);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #photo-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        #modal-img {
            max-width: 80%;
            max-height: 70vh;
            border-radius: 15px;
            border: 3px solid #ff69b4;
            margin-bottom: 25px;
            object-fit: contain;
            transform: scale(0.65);
            transition: transform 0.4s ease-out;
        }

        #photo-modal.show #modal-img {
            transform: scale(1);
        }

        .close-btn {
            background: linear-gradient(45deg, #ff2a6d, #ff758c);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="space"></div>

    <div class="container">
        <!-- PHẦN 1: Khám phá Đóa hoa A10 -->
        <div class="section active" id="section-1">
            <h1 class="main-title">🌸 28 Đóa Hoa Của Lớp A10 🌸</h1>
            <div class="content-box">
                <!-- Lưới 28 trái tim hồng -->
                <div class="flower-gallery" id="flower-gallery"></div>
            </div>
            <!-- Nút Tiếp tục chuyển sang phần 2 -->
            <button class="next-btn" onclick="switchSection(1)">Tiếp theo nèk ➔</button>
        </div>

        <!-- PHẦN 2: Bìa thư & Thư chúc mừng -->
        <div class="section" id="section-2">
            <div class="envelope-container">
                <!-- Bìa thư -->
                <div class="envelope" id="envelope">
                    <!-- Nút tròn mở thư ở giữa -->
                    <div class="open-seal" onclick="openLetter()">Mở</div>
                    
                    <!-- Thư chúc mừng giấu bên trong -->
                    <div class="letter">
                        <h2>💌 Gửi các bạn nữ A10! 💌</h2>
                        <p>
                            Gửi các bạn nữ A10 thân yêu...<br>
                            Năm này chúng tớ đã đặc biệt chuẩn bị một món quà nhỏ cho các bạn...<br>
                            Chúc các bạn luôn xinh đẹp, rạng rỡ và hạnh phúc.<br>
                            Chúc mừng 20/10!
                        </p>
                        <div class="signature">Thân ái,<br>Tập thể Nam lớp A10 ❤️</div>
                    </div>
                </div>
            </div>
            <!-- Nút Quay lại phần 1 -->
            <button class="next-btn" onclick="switchSection(0)" style="margin-top: 200px;">🔄 Quay lại</button>
        </div>
    </div>

    <!-- Modal Phóng To Ảnh & Nút Quay Lại -->
    <div id="photo-modal">
        <img id="modal-img" src="" alt="Ảnh ngẫu nhiên A10">
        <button class="close-btn" onclick="closePhotoModal()">Quay Lại ↩</button>
    </div>

    <script>
        // Mảng 28 ảnh ngẫu nhiên (.jpg) cho 28 trái tim (Cần thay bằng ảnh thực tế)
        const flowerImages = [
            "anh1.jpg", "anh2.jpg", "anh3.jpg", "anh4.jpg", "anh5.jpg", "anh6.jpg", "anh7.jpg",
            "anh8.jpg", "anh9.jpg", "anh10.jpg", "anh11.jpg", "anh12.jpg", "anh13.jpg", "anh14.jpg",
            "anh15.jpg", "anh16.jpg", "anh17.jpg", "anh18.jpg", "anh19.jpg", "anh20.jpg", "anh21.jpg",
            "anh22.jpg", "anh23.jpg", "anh24.jpg", "anh25.jpg", "anh26.jpg", "anh27.jpg", "anh28.jpg"
        ];

        // Tạo sao lấp lánh nền
        const space = document.getElementById('space');
        for (let i = 0; i < 140; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3.5 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            space.appendChild(star);
        }

        // Tạo icon Trái tim & Hoa bay phong phú toàn màn hình
        const icons = ['🌸', '💖', '🌷', '✨', '🌹', '💐', '❤️'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.className = 'floating-icon';
            el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (4.5 + Math.random() * 5.5) + 's';
            el.style.animationDelay = (Math.random() * 6) + 's';
            el.style.fontSize = (14 + Math.random() * 20) + 'px';
            document.body.appendChild(el);
        }

        // Tạo Bong bóng hồng lơ lửng
        for (let i = 0; i < 15; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 95 + 'vw';
            balloon.style.animationDuration = (7 + Math.random() * 6) + 's';
            balloon.style.animationDelay = (Math.random() * 6) + 's';
            document.body.appendChild(balloon);
        }

        // Khởi tạo Lưới 28 Đóa hoa (Trái tim hồng)
        const gallery = document.getElementById('flower-gallery');
        for (let i = 0; i < 28; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-flower';
            
            // Lấy ngẫu nhiên một ảnh từ mảng khi nhấn vào
            heart.addEventListener('click', () => {
                const randomImgSrc = flowerImages[Math.floor(Math.random() * flowerImages.length)];
                openPhotoModal(randomImgSrc);
            });
            gallery.appendChild(heart);
        }

        // Chuyển slide
        function switchSection(index) {
            const sections = document.querySelectorAll('.section');
            sections.forEach((sec, idx) => {
                sec.classList.remove('active');
                if (idx === index) sec.classList.add('active');
            });
            // Reset trạng thái thư nếu quay lại
            if (index === 0) {
                document.getElementById('envelope').classList.remove('opened');
            }
        }

        // Hiệu ứng Mở thư
        function openLetter() {
            document.getElementById('envelope').classList.add('opened');
        }

        // Mở modal ảnh
        function openPhotoModal(imgSrc) {
            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.add('show');
        }

        // Đóng modal ảnh
        function closePhotoModal() {
            document.getElementById('photo-modal').classList.remove('show');
        }
    </script>
</body>
</html>
